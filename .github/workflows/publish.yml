name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}

env:
  DOCKCROSS_TAG: "20250818-0a27819"

jobs:
  host-dependencies:
    name: Host dependencies (protoc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: cache
        with:
          path: host-install
          key: host-install-${{ hashFiles('src/host-dependencies/**') }}-1

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=$(pwd)/host-install \
                -DCMAKE_INSTALL_PREFIX=$(pwd)/host-install \
                -DCMAKE_EXE_LINKER_FLAGS="-static" \
                -Bbuild/host-dependencies -Ssrc/host-dependencies
          cmake --build build/host-dependencies -j$(nproc)

      - uses: actions/upload-artifact@v7
        with:
          name: host-install
          path: host-install/
          retention-days: 1

  # macOS runners have no Docker, so dockcross cannot run there and the Android libraries have to be built here
  # and carried over.
  android-native:
    name: ${{ matrix.abi }}
    needs: host-dependencies
    runs-on: ubuntu-24.04
    env:
      OCI_EXE: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: android-arm64
            jni_dir: arm64-v8a
          - abi: android-arm
            jni_dir: armeabi-v7a
          - abi: android-x86
            jni_dir: x86
          - abi: android-x86_64
            jni_dir: x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: host-install
          path: host-install

      - name: Restore protoc permissions
        run: chmod +x host-install/bin/*

      - name: Setup dockcross
        run: |
          docker run --rm dockcross/${{ matrix.abi }}:${{ env.DOCKCROSS_TAG }} > ./dockcross
          chmod +x ./dockcross

      - uses: actions/cache@v6
        id: cache
        with:
          path: build/dependencies/${{ matrix.abi }}/install
          key: deps-${{ matrix.abi }}-${{ hashFiles('src/dependencies/**') }}-1

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./dockcross cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/work/build/dependencies/${{ matrix.abi }}/install \
            -DCMAKE_INSTALL_PREFIX=build/dependencies/${{ matrix.abi }}/install \
            -DHOST_PROTOC_EXECUTABLE=/work/host-install/bin/protoc \
            -Bbuild/dependencies/${{ matrix.abi }} -Ssrc/dependencies
          ./dockcross /bin/bash -c "sudo apt-get update && sudo apt-get install -y python3-packaging && cmake --build build/dependencies/${{ matrix.abi }} -j\$(nproc)"

      - name: Build libvalhalla_jni.so
        run: |
          ./dockcross cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/work/build/dependencies/${{ matrix.abi }}/install \
            -Bbuild/main/${{ matrix.abi }} -Ssrc/main
          ./dockcross cmake --build build/main/${{ matrix.abi }} -j$(nproc)

      - uses: actions/upload-artifact@v7
        with:
          name: jniLibs-${{ matrix.jni_dir }}
          path: build/main/${{ matrix.abi }}/libvalhalla_jni.so
          retention-days: 1

  publish:
    name: Publish to Maven Central
    needs: android-native
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # A tag publishes a release at that version; anything else publishes the -SNAPSHOT the build file
      # falls back to, which goes to Central's snapshot repository.
      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *-SNAPSHOT|"") echo "Tag $GITHUB_REF_NAME is not a release version" >&2; exit 1 ;;
            esac
            echo "VERSION=$version" >> $GITHUB_ENV
            echo "GRADLE_VERSION=-PVERSION=$version" >> $GITHUB_ENV
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: jniLibs-*
          path: /tmp/jniLibs

      - name: Place Android libraries
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p kmp/valhalla/src/androidMain/jniLibs/$abi
            cp /tmp/jniLibs/jniLibs-$abi/libvalhalla_jni.so kmp/valhalla/src/androidMain/jniLibs/$abi/
          done

      - uses: actions/cache@v6
        with:
          path: |
            src/build/ios/host/install
            src/build/ios/device/dependencies/install
            src/build/ios/sim-arm64/dependencies/install
          key: ios-deps-${{ hashFiles('src/dependencies/**', 'src/host-dependencies/**', 'src/cmake/**') }}-1

      - name: Build iOS libraries
        run: |
          src/build_ios.sh
          src/install_ios.sh

      - name: Check third-party SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/third_party.py --check

      - name: Stamp the SBOM with the release version
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/third_party.py --version "$VERSION"

      - name: Publish
        working-directory: kmp/valhalla
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishToMavenCentral $GRADLE_VERSION --no-configuration-cache
