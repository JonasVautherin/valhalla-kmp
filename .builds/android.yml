arch: x86_64
image: alpine/3.21
packages:
  - docker
  - gcompat
  - openjdk17
sources:
  - https://git.sr.ht/~jonasvautherin/valhalla-android
environment:
  ANDROID_HOME: /tmp/android-sdk
artifacts:
  - /tmp/valhalla-artifacts.tar.gz
tasks:
  - prepare-docker: |
      sudo addgroup build docker
      sudo service docker start
  - install-docker-arm64: |
      docker run --rm dockcross/android-arm64 > ./dockcross-android-arm64
      chmod +x ./dockcross-android-arm64
  - build-dependencies-arm64: |
      ./dockcross-android-arm64 cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-arm64/install -DCMAKE_INSTALL_PREFIX=valhalla-android/build/dependencies/android-arm64/install -Bvalhalla-android/build/dependencies/android-arm64 -Svalhalla-android/src/dependencies
      ./dockcross-android-arm64 cmake --build valhalla-android/build/dependencies/android-arm64
  - build-lib-arm64: |
      ./dockcross-android-arm64 cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-arm64/install -Bvalhalla-android/build/main/android-arm64 -Svalhalla-android/src/main
      ./dockcross-android-arm64 cmake --build valhalla-android/build/main/android-arm64
  - copy-lib-arm64: |
      mkdir -p valhalla-android/android/valhalla/src/main/prebuiltLibs/arm64-v8a
      cp valhalla-android/build/main/android-arm64/libvalhalla_jni.so valhalla-android/android/valhalla/src/main/prebuiltLibs/arm64-v8a
  - cleanup-arm64: |
      docker system prune -a -f
      rm -rf valhalla-android/build
  - install-docker-arm: |
      docker run --rm dockcross/android-arm > ./dockcross-android-arm
      chmod +x ./dockcross-android-arm
  - build-dependencies-arm: |
      ./dockcross-android-arm cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-arm/install -DCMAKE_INSTALL_PREFIX=valhalla-android/build/dependencies/android-arm/install -Bvalhalla-android/build/dependencies/android-arm -Svalhalla-android/src/dependencies
      ./dockcross-android-arm /bin/bash -c "sudo apt-get update && sudo apt-get install -y python3-packaging && cmake --build valhalla-android/build/dependencies/android-arm"
  - build-lib-arm: |
      ./dockcross-android-arm cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-arm/install -Bvalhalla-android/build/main/android-arm -Svalhalla-android/src/main
      ./dockcross-android-arm cmake --build valhalla-android/build/main/android-arm
  - copy-lib-arm: |
      mkdir -p valhalla-android/android/valhalla/src/main/prebuiltLibs/armeabi-v7a
      cp valhalla-android/build/main/android-arm/libvalhalla_jni.so valhalla-android/android/valhalla/src/main/prebuiltLibs/armeabi-v7a
  - cleanup-arm: |
      docker system prune -a -f
      rm -rf valhalla-android/build
  - install-docker-x86: |
      docker run --rm dockcross/android-x86 > ./dockcross-android-x86
      chmod +x ./dockcross-android-x86
  - build-dependencies-x86: |
      ./dockcross-android-x86 cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-x86/install -DCMAKE_INSTALL_PREFIX=valhalla-android/build/dependencies/android-x86/install -Bvalhalla-android/build/dependencies/android-x86 -Svalhalla-android/src/dependencies
      ./dockcross-android-x86 /bin/bash -c "sudo apt-get update && sudo apt-get install -y python3-packaging && cmake --build valhalla-android/build/dependencies/android-x86"
  - build-lib-x86: |
      ./dockcross-android-x86 cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-x86/install -Bvalhalla-android/build/main/android-x86 -Svalhalla-android/src/main
      ./dockcross-android-x86 cmake --build valhalla-android/build/main/android-x86
  - copy-lib-x86: |
      mkdir -p valhalla-android/android/valhalla/src/main/prebuiltLibs/x86
      cp valhalla-android/build/main/android-x86/libvalhalla_jni.so valhalla-android/android/valhalla/src/main/prebuiltLibs/x86
  - cleanup-x86: |
      docker system prune -a -f
      rm -rf valhalla-android/build
  - install-docker-x86_64: |
      docker run --rm dockcross/android-x86_64 > ./dockcross-android-x86_64
      chmod +x ./dockcross-android-x86_64
  - build-dependencies-x86_64: |
      ./dockcross-android-x86_64 cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-x86_64/install -DCMAKE_INSTALL_PREFIX=valhalla-android/build/dependencies/android-x86_64/install -Bvalhalla-android/build/dependencies/android-x86_64 -Svalhalla-android/src/dependencies
      ./dockcross-android-x86_64 /bin/bash -c "sudo apt-get update && sudo apt-get install -y python3-packaging && cmake --build valhalla-android/build/dependencies/android-x86_64"
  - build-lib-x86_64: |
      ./dockcross-android-x86_64 cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/work/valhalla-android/build/dependencies/android-x86_64/install -Bvalhalla-android/build/main/android-x86_64 -Svalhalla-android/src/main
      ./dockcross-android-x86_64 cmake --build valhalla-android/build/main/android-x86_64
  - copy-lib-x86_64: |
      mkdir -p valhalla-android/android/valhalla/src/main/prebuiltLibs/x86_64
      cp valhalla-android/build/main/android-x86_64/libvalhalla_jni.so valhalla-android/android/valhalla/src/main/prebuiltLibs/x86_64
  - cleanup-x86_64: |
      docker system prune -a -f
      rm -rf valhalla-android/build
  - install-android-sdk: |
      mkdir -p /tmp/android-tools
      curl -L https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip --output /tmp/android-tools/android-tools.zip
      cd /tmp/android-tools
      unzip android-tools.zip
      mkdir -p /tmp/android-sdk
      echo y | /tmp/android-tools/cmdline-tools/bin/sdkmanager --sdk_root=/tmp/android-sdk "platforms;android-35"
  - build-valhalla-aar: |
      cd ./valhalla-android/android/valhalla
      ./gradlew assembleDebug
  - run-android-tests: |
      cd ./valhalla-android/android/valhalla
      ./gradlew test
  - collect-artifacts: |
      tar -czf /tmp/valhalla-artifacts.tar.gz valhalla-android/android/valhalla/build/outputs/aar/*
